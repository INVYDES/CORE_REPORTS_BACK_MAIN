server {
    listen ${PORT} default_server;
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for Vue Router
    location /core-reports/ {
        try_files $uri $uri/ /core-reports/index.html;
    }

    # Health check for Cloud Run
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Optional: proxy /api if backend is same project (not needed when VITE_API_URL points directly to Cloud Run)
    # location /api/ {
    #     proxy_pass https://csrecords-1095995886918.us-central1.run.app;
    # }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
