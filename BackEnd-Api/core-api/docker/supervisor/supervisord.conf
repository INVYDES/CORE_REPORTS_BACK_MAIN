[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Cada proceso escribe a stdout/stderr para que el log quede en la salida del
; contenedor (Railway/Cloud Run lo captura). entrypoint.sh desactiva los
; programas que no correspondan al CONTAINER_ROLE.
[include]
files = /etc/supervisor/conf.d/*.conf
