[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=60 --backoff=5 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
